name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install --ignore-scripts
      - run: node --check server.js src/routes.js src/db.js src/scraper/catalogClient.js src/scraper/scrapeRunner.js src/scraper/productScraper.js

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: cd frontend && npm install --include=dev
      - run: cd frontend && npx oxlint --ignore-path .gitignore || true
        env:
          NODE_ENV: development

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Build Frontend SPA
        run: |
          cd frontend
          npm install --include=dev
          npx vite build
        env:
          NODE_ENV: development
          VITE_API_URL: https://pricetracker-backend-8log.onrender.com/api
